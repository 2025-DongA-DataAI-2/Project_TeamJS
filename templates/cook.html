<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
  * { box-sizing: border-box; }

:root{
  --black:#111;
  --charcoal:#1a1a1a;
  --line:#e3e3e6;
  --soft:#f7f7f8;
}

body{
  margin: 0;
  font-family: "Pretendard","Noto Sans KR",Arial,sans-serif;
  background: #f6f6f6;
  color: var(--black);
  padding: 40px 0;
}

/* 타이틀 */
#family{
  margin: 0 0 36px;
  text-align: center;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.6px;
}

/* 전체 프레임 */
table{
  width: min(1200px, 92vw);
  height: 720px;
  margin: 0 auto;
  border-collapse: collapse;
  background: #fff;

  border: 1px solid #242424;
  border-radius: 18px;               /* 다시 둥글림 */
  overflow: hidden;

  box-shadow: 0 0 0 1px #bdbdc2;
  
  /*0 12px 32px rgba(0,0,0,0.01); 부드러운 그림자 */
}

th, td{
  padding: 0;
  vertical-align: top;
}

/* 좌측 */
th, table tr td:first-child{
  width: 300px;
  background: var(--soft);
  border-right: 1px solid var(--line);
}

/* 목차 헤더 */
th.menu-title{
  height: 88px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.18em;
  text-align: center;
  vertical-align: middle;
  color: var(--black);

  background: #f4f5f7;
  border-bottom: 1px solid var(--line);
}

/* 목차 항목 */
table tr td:first-child a{
  display: flex;
  align-items: center;

  width: 100%;
  height: 100%;
  padding: 18px 22px;

  color: var(--black);
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;

  transition:
    background 0.15s ease,
    color 0.15s ease,
    padding-left 0.15s ease;
}

/* hover: 완전 블랙 ❌ → 차콜 */
table tr td:first-child:hover{
  background: #ececef;
}

table tr td:first-child:hover a{
  padding-left: 28px;    /* ‘선택된 느낌’ */
}

/* 클릭 시만 살짝 어두워짐 */
table tr td:first-child:active{
  background: #dedee3;
}

/* 본문 */
iframe{
  width: 100%;
  height: 720px;
  border: 0;
  display: block;
  background: #fff;
}

/* 반응형 */
@media (max-width: 900px){
  table{ width: 96vw; }
  th, table tr td:first-child{ width: 240px; }

  th.menu-title{
    height: 78px;
    font-size: 18px;
  }

  table tr td:first-child a{
    font-size: 14px;
    padding: 16px 16px;
  }
}

  </style>


</head>

<body>
  <h1 id="family">흑백드라마 : 장르의 전쟁</h1>

  <table>
    <tr>
      <th class="menu-title">목차</th>
      <td rowspan="8">
        <iframe name="result" frameborder="0"></iframe>
      </td>
    </tr>
    <tr><td><a href="{{url_for('result', no='1')}}" target="result">1. 분석 목표 및 방법</a></td></tr>
    <tr><td><a href="{{url_for('result', no='2')}}" target="result">2.사용한 라이브러리 및 활용 데이터셋</a></td></tr>
    <tr><td><a href="{{url_for('result', no='3')}}" target="result">3. 데이터 전처리 과정</a></td></tr>
    <tr><td><a href="{{url_for('result', no='4')}}" target="result">4. 분석결과시각화</a></td></tr>
    <tr><td><a href="{{url_for('result', no='5')}}" target="result">5. 분석에 대한 결론</a></td></tr>
    <tr><td><a href="{{url_for('result', no='6')}}" target="result">6. 참고문헌</a></td></tr>
    <tr><td><a href="{{url_for('result', no='7')}}" target="result">7. 팀원역할</a></td></tr>
  </table>
</body>
</html>
