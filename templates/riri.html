<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>흑백드라마 : 장르의 전쟁</title>

  <style>
    * { box-sizing: border-box; }

  
    :root{
      --black:#0f0f0f;      /* 바깥 배경 */
      --charcoal:#1c1c1c;   /* 텍스트 */
      --line:#cfcfcf;       /* 경계선 */
      --panel:#f2f2f2;      /* 목차 패널 */
      --paper:#fbfbfb;      /* 본문 종이 */
    }

    body{
      margin: 0;
      font-family: "Pretendard","Noto Sans KR",Arial,sans-serif;
      background: var(--black);
      color: var(--charcoal);
      padding: 48px 0;
    }

    /* 인트로 재생 동안 스크롤/터치 방지 */
    body.intro-on{
      overflow: hidden;
    }

    /* 타이틀 */
    #family{
      text-align: center;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -0.6px;
      color: #ffffff;
      margin-bottom: 36px;
    }

    #family::after{
      content:"";
      display:block;
      width: 96px;
      height: 2px;
      background: #ffffff;
      margin: 16px auto 0;
      opacity: 0.85;
    }

    /* 표 등장 */
    table{
      width: min(1200px, 92vw);
      height: 720px;
      margin: 0 auto;
      border-collapse: collapse;
      background: var(--paper);

      border-radius: 18px;
      overflow: hidden;

      box-shadow:
        0 0 0 1px rgba(255,255,255,0.15),
        0 24px 60px rgba(0,0,0,0.6);

      opacity: 0;
      transform: translateY(12px);
      transition: opacity 1.05s ease, transform 1.05s ease; /* ← 조금 더 길게 */
    }

    body.ready table{
      opacity: 1;
      transform: translateY(0);
    }

    th, td{
      padding: 0;
      vertical-align: top;
    }

    /* 목차 패널 */
    th, table tr td:first-child{
      width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    /* 목차 헤더 */
    th.menu-title{
      height: 88px;
      text-align: center;
      vertical-align: middle;

      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: #000;

      background: #e6e6e6;
      border-bottom: 1px solid var(--line);
    }

    /* 목차 항목 */
    table tr td:first-child{
      position: relative;
      border-bottom: 1px solid #dedede;
    }

    table tr td:first-child a{
      display: flex;
      align-items: center;

      width: 100%;
      height: 100%;
      padding: 18px 22px;

      color: #000;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;

      transition:
        background 0.15s ease,
        padding-left 0.15s ease;
    }

    /* 왼쪽 강조 바 */
    table tr td:first-child::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width: 0;
      background: #000;
      transition: width 0.15s ease;
    }

   
    table tr td:first-child:hover{
      background: #e0e0e0;
    }

    table tr td:first-child:hover::before{
      width: 4px;
    }

    table tr td:first-child:hover a{
      padding-left: 28px;
    }

    /* 본문 */
    iframe{
      width: 100%;
      height: 720px;
      border: 0;
      display: block;
      background: var(--paper);
    }

    /* 반응형 */
    @media (max-width: 900px){
      table{ width: 96vw; }
      th, table tr td:first-child{ width: 240px; }

      th.menu-title{
        height: 76px;
        font-size: 16px;
      }

      table tr td:first-child a{
        font-size: 14px;
        padding: 16px;
      }
    }

    

    
/* =========================
   INTRO (클릭 시작 / 이미지로 시작)
========================= */

#intro{
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 99999;
  overflow: hidden;
  display: grid;
  place-items: center;
}

/* 검정 레이어(깜박 담당) */
.intro-black{
  position: absolute;
  inset: 0;
  background: #000;
  opacity: 0; 
}

/* 이미지 기본 상태 (시작을 이미지로) */
.intro-shot{
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  opacity: 1; 
  transform: none;
  filter: grayscale(1) contrast(1.12) brightness(0.9);
}

/* 시퀀스 시작 */
#intro.play .intro-black{
  animation: blackFlicker 3.2s ease-in-out forwards;
}
#intro.play .intro-shot{
  animation: shotFlicker 3.2s ease-in-out forwards;
}

/* 마지막 페이드아웃 */
#intro.out{
  animation: introOut 0.65s ease forwards;
}

/* ✅ 검정 레이어: 1=검정, 0=이미지 */
@keyframes blackFlicker{
  0%   { opacity: 0; }   /* 시작: 이미지 */

  
  12%  { opacity: 0; }
  20%  { opacity: 1; }   /* 검정 */
  30%  { opacity: 0; }   /* 이미지 */
  42%  { opacity: 0; }   /* 이미지 유지 */
  50%  { opacity: 1; }   /* 검정 */

  
  58%  { opacity: 1; }
  64%  { opacity: 0; }
  70%  { opacity: 1; }

  
  74%  { opacity: 0; }
  78%  { opacity: 1; }

  
  82%  { opacity: 0; }
  85%  { opacity: 1; }
  88%  { opacity: 0; }
  91%  { opacity: 1; }

  
  94%  { opacity: 1; }   
  100% { opacity: 1; }   
}


@keyframes shotFlicker{
  0%   { opacity: 1;  }

  
  20%  { opacity: 0;  } 
  30%  { opacity: 1; }
  42%  { opacity: 1; }
  50%  { opacity: 0;  }

  
  64%  { opacity: 1; }
  70%  { opacity: 0;  }

  
  74%  { opacity: 1; }
  78%  { opacity: 0; }

  
  82%  { opacity: 1; }
  85%  { opacity: 0; }
  88%  { opacity: 1;  }
  91%  { opacity: 0; }

  
  94%  { opacity: 0; }
  100% { opacity: 0;  }
}

@keyframes introOut{
  to { opacity: 0; visibility: hidden; }

}
   </style>
</head>

<body>

  <!-- ✅ Intro Overlay -->
  <div id="intro" aria-hidden="true">
    <div class="intro-black"></div>
    <img class="intro-shot" src="{{ url_for('static', filename='intro.png') }}" alt="intro shot">
  </div>

  <h1 id="family">흑백드라마 : 장르의 전쟁</h1>

  <table>
    <tr>
      <th class="menu-title">목차</th>
      <td rowspan="8">
        <iframe name="result" frameborder="0"></iframe>
      </td>
    </tr>
    <tr><td><a href="{{url_for('result', no='1')}}" target="result">1. 분석 목표 & 가설 설정</a></td></tr>
    <tr><td><a href="{{url_for('result', no='2')}}" target="result">2. 사용 라이브러리, 데이터셋, 분석 방법</a></td></tr>
    <tr><td><a href="{{url_for('result', no='3')}}" target="result">3. 데이터 전처리 과정</a></td></tr>
    <tr><td><a href="{{url_for('result', no='4')}}" target="result">4. 분석결과시각화</a></td></tr>
    <tr><td><a href="{{url_for('result', no='5')}}" target="result">5. 분석에 대한 결론</a></td></tr>
    <tr><td><a href="{{url_for('result', no='6')}}" target="result">6. 참고자료</a></td></tr>
    <tr><td><a href="{{url_for('result', no='7')}}" target="result">7. 팀원역할</a></td></tr>
  </table>

  <script>
    window.addEventListener('load', () => {
    const intro = document.getElementById('intro');
    if(!intro) return;

    const seq = 3.2;
    const holdBeforeTable = 250; // 

    document.body.classList.add('intro-on');

    const start = () => {
      intro.removeEventListener('click', start);
      window.removeEventListener('keydown', onKey);

      intro.classList.add('play');

      setTimeout(() => {
        intro.classList.add('out');

        setTimeout(() => {
          document.body.classList.add('ready'); // 표 등장
        }, holdBeforeTable);

        document.body.classList.remove('intro-on');
        setTimeout(() => intro.remove(), 700);
      }, seq * 1000);
    };

    const onKey = (e) => {
      if (e.key === 'Enter' || e.key === ' ') start();
    };

    intro.addEventListener('click', start);
    window.addEventListener('keydown', onKey);
  });
  </script>
</body>
</html>
