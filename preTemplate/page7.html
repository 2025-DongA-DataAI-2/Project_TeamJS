<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>팀원 역할</title>

  <style>
    :root{
      --black:#111;
      --muted:#555;
      --line:#e3e3e6;
      --soft:#f7f7f8;
      --card:#ffffff;
    }

    body{
      margin:0;
      font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;
      color:var(--black);
      background:#fff;
    }

    /* ✅ 3페이지부터 적용하기로 한 여백 */
    .wrap{
      padding: 40px 42px;
    }

    h2{
      margin: 0 0 16px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .sub{
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 14px;
      align-items: start;
    }

    .avatar{
      width: 84px;
      height: 84px;
      border-radius: 14px;
      border: 1px dashed #cfd0d6;
      background: var(--soft);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
      overflow: hidden;
    }

    /* 실제 이미지 쓸 때 */
    .avatar img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name{
      margin: 2px 0 6px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.2px;
    }

    .role{
      display: inline-block;
      font-size: 12px;
      color: var(--muted);
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }

    ul{
      margin: 0;
      padding-left: 18px;
      font-size: 14px;
      line-height: 1.75;
    }

    @media (max-width: 720px){
      .grid{ grid-template-columns: 1fr; }
      .card{ grid-template-columns: 76px 1fr; }
      .avatar{ width: 76px; height: 76px; border-radius: 12px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h2>팀원 역할</h2>
    <br>
    <!-- <p class="sub">각 팀원의 담당 업무를 정리하였다. (사진 영역은 추후 이미지로 교체 가능)</p> -->

    <div class="grid">
      <!-- 이준서 -->
      <section class="card">
        <div class="avatar">
          <!-- 사진 넣을 때 아래 주석 해제하고 src만 교체 -->
          <!-- <img src="/static/team/leejunseo.jpg" alt="이준서"> -->
          사진<br/>영역
        </div>
        <div>
          <div class="name">이준서</div>
          <div class="role">팀장, 프론트</div>
          <ul>
            <li>맡은 역할 1</li>
            <li>맡은 역할 2</li>
          </ul>
        </div>
      </section>

      <!-- 문동현 -->
      <section class="card">
        <div class="avatar">
          <!-- <img src="/static/team/moondonghyun.jpg" alt="문동현"> -->
          사진<br/>영역
        </div>
        <div>
          <div class="name">문동현</div>
          <div class="role">데이터 분석</div>
          <ul>
            <li>맡은 역할 1</li>
            <li>맡은 역할 2</li>
          </ul>
        </div>
      </section>

      <!-- 김유진 -->
      <section class="card">
        <div class="avatar">
          <!-- <img src="/static/team/kimyujin.jpg" alt="김유진"> -->
          사진<br/>영역
        </div>
        <div>
          <div class="name">김유진</div>
          <div class="role">데이터 분석</div>
          <ul>
            <li>맡은 역할 1</li>
            <li>맡은 역할 2</li>
          </ul>
        </div>
      </section>

      <!-- 박지선 -->
      <section class="card">
        <div class="avatar">
          <!-- <img src="/static/team/parkjiseon.jpg" alt="박지선"> -->
          사진<br/>영역
        </div>
        <div>
          <div class="name">박지선</div>
          <div class="role">플라스크</div>
          <ul>
            <li>맡은 역할 1</li>
            <li>맡은 역할 2</li>
          </ul>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
