<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>안녕하세요</h1>
    <h2>안녕하세요2</h2>
    <h3>안녕하세요3</h3>
    <h4>안녕하세요4</h4>
    <h5>안녕하세요5</h5>

    <p>다시</p>
    <span>???</span>

    <h5>나는 지금 집에 가고 싶다</h5>
    <button id="btn1">예</button>
    <button id="btn2">아니오</button>


    <script>
        document.querySelector("p").addEventListener("mouseover",()=>{
            document.querySelector("p").innerHTML = "<h1>숨은 메세지입니다.</h1>"
        })

        document.getElementById("btn1").addEventListener("click",()=>{
            document.querySelector("p").innerHTML = "갈수가 없습니다"
        })
        document.getElementById("btn2").addEventListener("click",()=>{
            document.querySelector("p").innerHTML = "그짓말을 하고 있습니다"
        })

    </script>
</body>
</html>
